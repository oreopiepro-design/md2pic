name: md2pic
on:
  push:
    paths: ['docs/*.md']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # 1. 国内镜像 + 仅安装必要依赖
      - name: install md-to-pdf
        env:
          PUPPETEER_DOWNLOAD_HOST: https://npmmirror.com/mirrors
        run: |
          npm i -g md-to-pdf
          # 字体防止中文方块
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # 2. 转图
      - run: |
          for f in docs/*.md; do
            md-to-pdf "$f" --output "${f%.md}.png" --as-img
          done

      # 3. 上传图床（同上）
      - name: upload
        env:
          SMMS_TOKEN: ${{ secrets.SMMS_TOKEN }}
        run: |
          sudo apt-get install -y jq
          for img in docs/*.png; do
            url=$(curl -s -F "smfile=@$img" -H "Authorization: $SMMS_TOKEN" https://sm.ms/api/v2/upload | jq -r .data.url)
            echo "![$(basename "$img")]($url)" >> pics.md
          done

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'bot: auto update pics'
