name: md2pic
on:
  push:
    paths: ['docs/*.md']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # 1. 安装真实存在的包
      - run: npm i -g md-to-pdf

      # 2. 批量转 png
      - run: |
          for f in docs/*.md; do
            md-to-pdf "$f" --output "${f%.md}.png" --as-img
          done

      # 3. 上传到图床（同以前）
      - name: upload
        env:
          SMMS_TOKEN: ${{ secrets.SMMS_TOKEN }}
        run: |
          sudo apt-get install -y jq
          for img in docs/*.png; do
            url=$(curl -s -F "smfile=@$img" -H "Authorization: $SMMS_TOKEN" https://sm.ms/api/v2/upload | jq -r .data.url)
            echo "![$(basename "$img")]($url)" >> pics.md
          done

      # 4. 把 pics.md 推回仓库
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'bot: auto update pics'
